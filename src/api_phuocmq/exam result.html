<div class="space-y-4">
  <div class="bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg px-4 py-3">
    Đề kiểm tra đã sẵn sàng! Mã đề: {{ exam_id }} — Tổng {{ final_exam|length }} câu.
  </div>

  {% for q in final_exam %}
  <div class="bg-white rounded-xl border p-4" x-data="{ selected: null }">
    <p class="text-xs text-slate-400 mb-1">{{ q.chuong }} · {{ q.bai }}</p>
    <p class="font-medium mb-3">Câu {{ loop.index }}: {{ q.question }}</p>
    <div class="space-y-2">
      {% for key, text in q.options.items() %}
      <label class="flex items-center gap-2 text-sm cursor-pointer">
        <input type="radio" name="q{{ q.id }}" value="{{ key }}" x-model="selected">
        <span><b>{{ key }}.</b> {{ text }}</span>
      </label>
      {% endfor %}
    </div>
    <div class="mt-3 text-sm" x-show="selected" x-cloak>
      <p :class="selected === '{{ q.answer }}' ? 'text-green-600 font-medium' : 'text-red-600 font-medium'"
         x-text="selected === '{{ q.answer }}' ? 'Chính xác!' : 'Chưa đúng, đáp án là {{ q.answer }}.'"></p>
      <p class="text-slate-600 mt-1">{{ q.giai_thich }}</p>
    </div>
  </div>
  {% endfor %}
</div>
