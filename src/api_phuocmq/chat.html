{% extends "base.html" %}
{% block title %}EDUAGENT - Hỏi đáp{% endblock %}
{% block content %}
<div class="bg-white rounded-xl border flex flex-col h-[70vh]">
  <div id="chat-log" class="flex-1 overflow-y-auto p-4 space-y-3">
    <div class="text-sm text-slate-500 text-center">Hãy đặt câu hỏi Toán, Văn hoặc Sử lớp 10 nhé!</div>
  </div>
  <form hx-post="/chat/{{ session_id }}/message"
        hx-target="#chat-log"
        hx-swap="beforeend"
        hx-on::after-request="this.reset()"
        class="border-t p-3 flex gap-2">
    <input type="text" name="message" required autocomplete="off"
           class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
           placeholder="Nhập câu hỏi...">
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Gửi</button>
  </form>
</div>
{% endblock %}
